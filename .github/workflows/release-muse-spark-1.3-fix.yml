name: Publish Muse Spark 1.3 Fix

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/release-muse-spark-1.3-fix.yml

permissions:
  contents: write
  actions: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: v0.2.0-muse-spark-1.3-fix.1
      BUILD_RUN_ID: "36283568283"
      BUILD_ARTIFACT: maka-windows-x64-muse-spark-1.3-fix
    steps:
      - name: Download verified Windows x64 build
        run: |
          mkdir -p release-assets
          gh run download "$BUILD_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name "$BUILD_ARTIFACT" \
            --dir release-assets
          find release-assets -maxdepth 2 -type f -print

      - name: Publish GitHub release
        run: |
          mapfile -t assets < <(find release-assets -type f \( -name '*.exe' -o -name '*.zip' -o -name 'latest*.yml' \) -print)
          test "${#assets[@]}" -gt 0

          cat > release-notes.md <<'EOF'
          Release focada exclusivamente na compatibilidade do OpenCode Go com Muse Spark 1.3 Contributor.

          Alteração funcional:
          - muse-spark-1.3-contributor passa a usar OpenAI Responses (/responses), seguindo o mesmo tratamento já usado pelo Muse Spark 1.2 Contributor.

          Patch principal: ef96f82dc189d38125cfbbdb12b14d876fe0b245
          Teste de regressão: d04a63b9d4ba253db95f2c38c48e52b152243619
          Binário Windows x64: build validado pelo workflow Fork Windows Build (run 36283568283).
          EOF

          gh release create "$RELEASE_TAG" "${assets[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Maka Windows x64 - Muse Spark 1.3 Fix" \
            --prerelease \
            --notes-file release-notes.md
