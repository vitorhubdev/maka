name: Fork Latest Windows Release

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/fork-latest-windows-release.yml'

permissions:
  contents: write

concurrency:
  group: fork-latest-windows-release
  cancel-in-progress: false

jobs:
  build-release:
    runs-on: windows-2025
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      RELEASE_TAG: v0.2.0-upstream-20260930-c838e1f
      UPSTREAM_SHA: c838e1fa779a48832f08134547576a0471033187
    steps:
      - name: Check out main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Verify upstream commit is included
        run: git merge-base --is-ancestor "$UPSTREAM_SHA" HEAD

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit

      - name: Update stable Rust
        run: rustup update stable --no-self-update

      - name: Package Windows x64
        run: npm run package:windows-x64

      - name: Verify Windows x64 package
        run: npm run verify:windows-x64 -- x64

      - name: Publish GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          assets=(apps/desktop/release/*.exe apps/desktop/release/*.zip apps/desktop/release/latest.yml apps/desktop/release/*.blockmap)
          if (( ${#assets[@]} == 0 )); then
            echo "No release assets found" >&2
            exit 1
          fi

          cat > "$RUNNER_TEMP/release-notes.md" <<'EOF'
          Fork sincronizado com o Apache Maka em 30/09/2026.

          Upstream incluído: apache/maka@c838e1fa779a48832f08134547576a0471033187
          Versão do pacote: 0.2.0
          Plataforma: Windows x64
          Status: prerelease não oficial do fork vitorhubdev/maka.

          O patch do Muse Spark 1.3 Contributor já está incorporado ao upstream usado neste build.
          EOF

          gh release delete "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$RELEASE_TAG" "${assets[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Maka 0.2.0 - upstream 2026-09-30 (c838e1f)" \
            --prerelease \
            --notes-file "$RUNNER_TEMP/release-notes.md"
