name: Fork Windows Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fork-windows-build-${{ github.sha }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit

      - name: Update stable Rust
        run: rustup update stable --no-self-update

      - name: Build Maka for Windows x64
        run: npm run package:windows-x64

      - name: Verify Windows package
        run: npm run verify:windows-x64 -- x64

      - name: Upload Windows build
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: maka-windows-x64-muse-spark-1.3-fix
          path: apps/desktop/release/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
